<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Info Dispositivo</title>
  <style>
    body{margin:0;background:#0b0c10;color:#e5e7eb;font-family:system-ui,Arial;padding:20px;}
    .box{background:#111827;padding:16px;border-radius:12px;margin-bottom:10px;border:1px solid #1f2937;}
    h1{font-size:20px;margin:0 0 10px;}
    .row{display:flex;flex-wrap:wrap;gap:10px;}
    .item{padding:10px;background:#0f172a;border:1px solid #1e293b;border-radius:10px;min-width:200px;flex:1;}
    .k{font-size:12px;color:#9aa3af;text-transform:uppercase;letter-spacing:0.5px;}
    .v{font-weight:600;margin-top:3px;word-break:break-word;}
  </style>
</head>
<body>
  <div class="box">
    <h1>🔍 Info del tuo dispositivo</h1>
    <p style="color:#9aa3af;margin:0 0 10px;">Queste informazioni sono visibili solo a te</p>
  </div>

  <div id="info" class="row"></div>

<script>
function getInfo() {
  const ua = navigator.userAgent;
  const width = screen.width, height = screen.height;
  const lang = navigator.language;
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const cores = navigator.hardwareConcurrency || "n/a";
  const ram = navigator.deviceMemory ? navigator.deviceMemory+"GB" : "n/a";

  // Device type
  let type = "Desktop";
  if(/iPhone/i.test(ua)) type = "iPhone";
  else if(/iPad/i.test(ua) || (/Macintosh/.test(ua) && 'ontouchstart' in window)) type = "iPad";
  else if(/Android/i.test(ua)) type = "Android";
  else if(/Mobile/i.test(ua)) type = "Telefono";

  // OS
  let os = "Sconosciuto";
  if(/Windows NT/i.test(ua)) os = "Windows";
  else if(/Mac OS X|Macintosh/i.test(ua)) os = "macOS / iOS";
  else if(/Android/i.test(ua)) os = "Android";
  else if(/Linux/i.test(ua)) os = "Linux";
  if(/CPU iPhone OS (\d+_\d+)/i.test(ua)) os = "iOS "+RegExp.$1.replace("_",".");
  if(/Android (\d+(\.\d+)?)/i.test(ua)) os = "Android "+RegExp.$1;

  // Browser
  let browser = "Sconosciuto";
  if(/Edg\//.test(ua)) browser = "Edge";
  else if(/OPR\//.test(ua)) browser = "Opera";
  else if(/Chrome\//.test(ua) && !/Chromium/.test(ua)) browser = "Chrome";
  else if(/Safari\//.test(ua) && !/Chrome\//.test(ua)) browser = "Safari";
  else if(/Firefox\//.test(ua)) browser = "Firefox";

  // Model (if possible from UA)
  let model = "";
  const m = ua.match(/;\s*(Pixel\s?[A-Za-z0-9 ]+|SM-[A-Za-z0-9]+).*;/) || ua.match(/;\s*([A-Za-z0-9\-]+)\s+Build\//);
  if(m && m[1]) model = m[1];
  if(!model && type.includes("iPhone")) model = "iPhone";
  if(!model && type.includes("iPad")) model = "iPad";

  return [
    ["Tipo dispositivo", type],
    ["Modello (se rilevabile)", model || "—"],
    ["Sistema operativo", os],
    ["Browser", browser],
    ["Risoluzione schermo", width+" x "+height],
    ["Lingua", lang],
    ["Timezone", tz],
    ["CPU Cores", cores],
    ["RAM stimata", ram],
    ["User-Agent", ua]
  ];
}

function render() {
  const data = getInfo();
  const container = document.getElementById("info");
  container.innerHTML = "";
  data.forEach(([k,v])=>{
    const div = document.createElement("div");
    div.className="item";
    div.innerHTML = `<div class="k">${k}</div><div class="v">${v}</div>`;
    container.appendChild(div);
  });
}

render();
</script>
</body>
</html>
